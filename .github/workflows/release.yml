name: release

on:
  push:
    tags: ["v*"]
    # Pushing a branch named release/vX.Y.Z also cuts release vX.Y.Z (for environments that cannot push tags).
    branches: ["release/v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (without the v prefix)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "value=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF_NAME" == release/v* ]]; then
            echo "value=${GITHUB_REF_NAME#release/v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi
      - name: Build binaries for every target
        working-directory: packages/kiwii
        env:
          KIWII_VERSION: ${{ steps.version.outputs.value }}
          KIWII_CHANNEL: latest
        run: bun run script/build.ts --archive
      - name: Attach archives to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          target_commitish: ${{ github.sha }}
          files: |
            packages/kiwii/dist/*.tar.gz
            packages/kiwii/dist/*.zip
            install
            install.ps1
          generate_release_notes: true
