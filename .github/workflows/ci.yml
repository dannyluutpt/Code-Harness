name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: core
        run: bun test --only-failures
        working-directory: packages/core
      - name: kiwii
        run: bun test --timeout 30000 --only-failures
        working-directory: packages/kiwii
        env:
          CI: "true"
      - name: tui
        run: bun test --timeout 30000 --only-failures
        working-directory: packages/tui
      - name: ui
        run: bun test src --only-failures
        working-directory: packages/ui
      - name: session-ui
        run: bun test src --only-failures
        working-directory: packages/session-ui
